{% extends "base.html" %}
{% block title %}Log in — My Flask App{% endblock %}
{% block content %}
<section class="auth-section">
    <form class="auth-card" method="post" novalidate>
        <h1>Welcome back</h1>
        <p class="auth-subtitle">Log in to your account to continue.</p>

        <div class="field">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" autocomplete="email" required>
        </div>

        <div class="field">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" autocomplete="current-password" required>
        </div>

        <button type="submit" class="btn btn-primary btn-block">Log in</button>

        <p class="auth-footer">Don't have an account? <a href="{{ url_for('register') }}">Sign up</a></p>
    </form>
</section>
{% endblock %}
