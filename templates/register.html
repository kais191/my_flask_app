{% extends "base.html" %}
{% block title %}Create account — My Flask App{% endblock %}
{% block content %}
<section class="auth-section">
    <form class="auth-card" method="post" novalidate>
        <h1>Create your account</h1>
        <p class="auth-subtitle">Get started free — no credit card required.</p>

        <div class="field-row">
            <div class="field">
                <label for="first_name">First name</label>
                <input type="text" id="first_name" name="first_name" autocomplete="given-name" required>
            </div>
            <div class="field">
                <label for="last_name">Last name</label>
                <input type="text" id="last_name" name="last_name" autocomplete="family-name" required>
            </div>
        </div>

        <div class="field">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" autocomplete="email" required>
        </div>

        <div class="field">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" autocomplete="new-password" required>
        </div>

        <button type="submit" class="btn btn-primary btn-block">Create account</button>

        <p class="auth-footer">Already have an account? <a href="{{ url_for('login') }}">Log in</a></p>
    </form>
</section>
{% endblock %}
