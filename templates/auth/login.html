{% extends "base.html" %}

{% block title %}Sign in | {{ brand.name }}{% endblock %}

{% block content %}
<section class="authpage">
  <div>
    <div class="formcard">
      <h2>Welcome back</h2>
      <p class="formcard__intro">Sign in to see your orders and saved addresses.</p>

      <form method="post" class="form">
        <input type="hidden" name="next" value="{{ request.args.get('next', '') }}">
        <div class="field">
          <label for="email">Email address</label>
          <input id="email" name="email" type="email" value="{{ email }}" autocomplete="email" required autofocus>
        </div>
        <div class="field">
          <label for="password">Password</label>
          <input id="password" name="password" type="password" autocomplete="current-password" required>
        </div>
        <label class="checkline">
          <input type="checkbox" name="remember" value="1">
          <span>Keep me signed in</span>
        </label>
        <button class="btn btn--block" type="submit">Sign in</button>
      </form>
    </div>
    <p class="authpage__foot">
      New here? <a href="{{ url_for('auth.register') }}">Create an account</a>
      · <a href="{{ url_for('checkout.track') }}">Track an order without signing in</a>
    </p>
  </div>
</section>
{% endblock %}
